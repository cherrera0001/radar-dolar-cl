name: Vigía de la corrida diaria

# Corre en la tarde y en la noche (UTC) de los días hábiles, después de la hora en que `diario` debió correr.
# Avisa si GitHub saltó o retrasó el cron de `diario`: ese caso no lo ve ninguna otra corrida.
on:
  schedule:
    - cron: "0 15,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Revisar la corrida diaria
        id: revisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: radar vigia --enviar

      - name: Aviso de caída del vigía
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: radar caida --componente vigia --estado ${{ steps.revisar.outcome }} --url "$RADAR_RUN_URL" --enviar

      - name: Versionar el registro de envíos
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/envios.json data/ejecuciones.jsonl
          git diff --cached --quiet || git commit -m "data: vigía $(date -u +%F)"
          git push || (git pull --rebase -q && git push)
