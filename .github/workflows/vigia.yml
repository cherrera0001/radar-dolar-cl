name: Vigía de la corrida diaria

# Corre en la tarde y en la noche (UTC) de los días hábiles, después de la hora en que `diario` debió correr.
# Avisa si GitHub saltó o retrasó el cron de `diario`: ese caso no lo ve ninguna otra corrida.
on:
  schedule:
    - cron: "0 15,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Revisar la corrida diaria
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: radar vigia --enviar

      - name: Versionar el registro de envíos
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/envios.json
          git diff --cached --quiet || git commit -m "data: vigía $(date -u +%F)"
          git push || (git pull --rebase -q && git push)
