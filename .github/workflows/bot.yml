name: Bot

# Atiende consultas de Telegram. GitHub puede retrasar el cron varios minutos.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Comparte grupo con Diario: ambos escriben en el repo, así que van en serie.
concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Atender consultas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: radar bot --una-vez

      - name: Versionar offset (solo si cambió)
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.json
          git diff --cached --quiet || git commit -m "bot: offset $(date -u +%F-%H%M)"
          git push || (git pull --rebase -X theirs -q && git push)
