name: Bot

# Escucha Telegram de forma continua. Cada corrida dura ~5,5 h (long polling) y al terminar
# dispara la siguiente, así que las consultas se atienden en segundos sin servidor propio.
# El cron es solo un vigía: si la cadena se corta, lo reinicia cuando GitHub lo programa.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

# Una sola cadena a la vez: dos getUpdates simultáneos hacen que Telegram rechace uno.
concurrency:
  group: radar-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Configurar git
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Escuchar Telegram (5,5 h)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: radar bot --durante 19800 --publicar

      - name: Versionar offset (solo si cambió)
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.json
          git diff --cached --quiet || git commit -m "bot: offset $(date -u +%F-%H%M)"
          git push || (git pull --rebase -X theirs -q && git push)

      - name: Encadenar la siguiente corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}"
