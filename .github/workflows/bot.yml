name: Bot

# Escucha Telegram de forma continua. Cada corrida dura ~5,5 h (long polling) y al terminar
# dispara la siguiente, así que las consultas se atienden en segundos sin servidor propio.
# El cron es solo un vigía: si la cadena se corta, lo reinicia cuando GitHub lo programa.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

# Una sola cadena a la vez: dos getUpdates simultáneos hacen que Telegram rechace uno.
concurrency:
  group: radar-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Configurar git
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Escuchar Telegram (5,5 h)
        id: escuchar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: radar bot --durante 19800 --publicar

      - name: Aviso de caída del bot
        if: always()  # la cadena se reintenta sola; este aviso le dice al dueño que Telegram lleva un rato caído
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: radar caida --componente bot --estado ${{ steps.escuchar.outcome }} --url "$RADAR_RUN_URL" --enviar

      - name: Versionar offset y bitácora (solo si cambió)
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.json data/ejecuciones.jsonl
          git diff --cached --quiet || git commit -m "bot: offset $(date -u +%F-%H%M)"
          git push || (git pull --rebase -X theirs -q && git push)

      - name: Encadenar la siguiente corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tras una caída, esperar antes de reencolar: si Telegram sigue en outage, la ráfaga de
          # reintentos inmediatos amplifica el problema (aprendizaje 2026-10-29: 10 corridas en 7 min).
          if [ "${{ steps.escuchar.outcome }}" = "failure" ]; then sleep 240; fi
          gh workflow run bot.yml --repo "${{ github.repository }}"
