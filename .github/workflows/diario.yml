name: Diario

# Días hábiles 12:00 UTC = 09:00 Chile en verano / 08:00 en invierno.
# GitHub puede retrasar los cron algunos minutos; no es un problema para datos diarios.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Actualizar series
        run: radar actualizar

      - name: Avisar si cambia el semáforo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: radar alerta --enviar

      - name: Versionar datos
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: actualización $(date -u +%F)"
          git push
