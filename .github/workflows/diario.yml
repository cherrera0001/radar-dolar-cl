name: Diario

# Días hábiles 12:00 UTC = 09:00 Chile en verano / 08:00 en invierno.
# GitHub puede retrasar los cron algunos minutos; no es un problema para datos diarios.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Actualizar series
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: radar actualizar

      - name: Avisos de salud de fuentes
        if: always()  # también si `radar actualizar` falla en todas las fuentes: ese es el caso que más importa avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: radar alerta --enviar

      - name: Instrucción mensual (solo dueño, días 1 a 5)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERFIL_DUENO: ${{ secrets.PERFIL_DUENO }}
        run: radar accion --enviar

      - name: Versionar datos
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: actualización $(date -u +%F)"
          git push || (git pull --rebase -q && git push)
