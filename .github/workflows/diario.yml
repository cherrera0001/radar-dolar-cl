name: Diario

# Días hábiles 12:00 UTC = 09:00 Chile en verano / 08:00 en invierno.
# GitHub puede retrasar los cron algunos minutos; no es un problema para datos diarios.
on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-datos
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Actualizar series
        id: actualizar
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASS: ${{ secrets.BCCH_PASS }}
        run: radar actualizar

      - name: Avisos de salud de fuentes
        if: always()  # también si `radar actualizar` falla en todas las fuentes: ese es el caso que más importa avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: radar alerta --enviar

      - name: Instrucción mensual (solo dueño, días 1 a 5)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERFIL_DUENO: ${{ secrets.PERFIL_DUENO }}
        run: radar accion --enviar

      - name: Aviso de caída del job
        if: always()  # un job en rojo solo se ve en Actions; sin este paso el dueño se entera tarde o nunca
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: radar caida --componente diario --estado ${{ steps.actualizar.outcome }} --url "$RADAR_RUN_URL" --enviar

      - name: Versionar datos
        if: always()
        run: |
          git config user.name "radar-dolar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: actualización $(date -u +%F)"
          git push || (git pull --rebase -q && git push)
