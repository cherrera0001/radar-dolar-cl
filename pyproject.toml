[project]
name = "radar-dolar-cl"
version = "0.1.0"
description = "Radar del dólar en Chile: describe el estado del dólar. No es asesoría financiera."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.37"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135  # textos en español para el usuario: mejor una línea legible que frases partidas
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
